
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1 id="hello">Loading…</h1>

    <p class="sub">

    </p>

    <p>Email: <strong id="email"></strong></p>

    <div class="actions">
      <a class="btn ghost" id="adminLink" href="/admin" hidden>
        Admin panel
      </a>

      <button class="ghost" type="button" id="logoutBtn">
        Log out
      </button>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
