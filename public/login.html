
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1>Log in</h1>
    <p class="sub">Use your email and password to open your account.</p>

    <form id="form" novalidate>
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button class="full" type="submit">Log in</button>
      <p id="msg" class="msg" role="alert"></p>
    </form>

    <p class="alt">
      New here? <a href="/register">Create an account</a>
    </p>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
